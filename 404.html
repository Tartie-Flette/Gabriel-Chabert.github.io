<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Introuvable | Gabriel Chabert</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <!-- Style critique pour éviter le flash de contenu non stylisé (FOUC) lors des transitions -->
    <style>
        .page-transition {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: #111111;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 1; 
            pointer-events: auto;
            transition: opacity 0.6s cubic-bezier(0.8, 0, 0.2, 1);
        }
        .page-transition.is-hidden {
            opacity: 0;
            pointer-events: none;
        }
        .page-transition svg {
            width: 90px;
            height: 90px;
            transform: scale(1.1);
            opacity: 1;
            transition: transform 0.6s cubic-bezier(0.8, 0, 0.2, 1), opacity 0.6s ease;
        }
        .page-transition.is-hidden svg {
            transform: scale(0.8);
            opacity: 0;
        }
    </style>
    <link rel="stylesheet" href="src/css/main.css">
    <script>
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark-mode');
        } else {
            document.documentElement.classList.remove('dark-mode');
        }
    </script>
    <!-- Bibliothèques CDN externes for transitions -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    
    <!-- Scripts applicatifs de base (non-modules pour fonctionner en file:// local) -->
    <script src="src/js/modules/theme.js"></script>
    <script src="src/js/modules/transitions.js"></script>
    
    <!-- Script modulaire pour les fonctionnalités avancées (3D et animations de scroll) -->
    <script type="module" src="src/js/main.js"></script>
</head>
<body>
    <div class="page-transition">
        <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
            <rect width="512" height="512" rx="112" fill="#C84B31"/>
            <text x="48%" y="54%" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="250" fill="#FDFBF7" text-anchor="middle" dominant-baseline="middle" letter-spacing="-15">GC</text>
            <circle cx="390" cy="350" r="28" fill="#E8A87C"/>
        </svg>
    </div>
    <script>
        // Masquer la transition après un bref délai pour assurer un fondu d'entrée fluide dès le premier rendu
        (function() {
            var overlay = document.querySelector('.page-transition');
            if (overlay) {
                window.transitionTimeout1 = setTimeout(function() {
                    if (!window.isTransitioning) {
                        overlay.classList.add('is-hidden');
                    }
                }, 50);
            }
        })();
        // Sécurité anti-blocage : masquer la transition après 1.5 seconde en cas de lenteur extrême
        window.transitionTimeout2 = setTimeout(function() {
            var overlay = document.querySelector('.page-transition');
            if (overlay && !overlay.classList.contains('is-hidden') && !window.isTransitioning) {
                overlay.classList.add('is-hidden');
            }
        }, 1500);
    </script>

    <nav class="navbar">
        <div class="nav-content">
            <a href="index.html" class="logo" style="text-decoration: none;">G. Chabert</a>
            <div class="nav-right">
                <ul class="nav-links">
                    <li><a href="index.html">Parcours</a></li>
                    <li><a href="projets.html">Projets</a></li>
                    <li><a href="resume.html">Resume</a></li>
                </ul>
                <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle theme">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="theme-icon">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
            </div>
        </div>
    </nav>

    <main class="container error-container">
        <h1 class="error-title">404</h1>
        <h2 class="error-subtitle">Système hors ligne</h2>
        <p class="error-text">La route que vous cherchez n'existe pas ou a été reconfigurée. Reprenons la navigation depuis le point de départ.</p>
        <a href="index.html" class="btn-primary">Retour à l'accueil</a>
    </main>


</body>
</html>
